services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://ninelens:${POSTGRES_PASSWORD}@db:5432/backend_production"
      POSTGRES_DB: backend_production

  frontend:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
