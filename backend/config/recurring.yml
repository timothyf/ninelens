production:
  synchronize_game_details:
    class: ScheduledGameDetailsSyncJob
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: <%= ENV.fetch('QUEUE_FINISHED_JOB_CLEANUP_SLEEP', 0.3) %>)"
    schedule: every hour at minute 12
  clear_expired_authentication_rate_limits:
    command: "AuthenticationRateLimit.expired.delete_all"
    schedule: every day at 4:25am
  clear_stale_user_sessions:
    command: "UserSession.stale.delete_all"
    schedule: every day at 4:35am
